[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftcatch"
version = "0.1.0.dev0"
description = "Catch the moment your AI agent's behaviour changes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Neel Deshmane" }]
keywords = [
    "ai", "agents", "llm", "testing", "regression", "record", "replay",
    "behaviour", "coverage", "pytest",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
mcp = [
    # v2 renamed FastMCP to MCPServer; the code here targets the v2 API.
    "mcp>=2.0",
]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "pytest-cov>=5",
    "anyio>=4",
    "ruff>=0.6",
    "mypy>=1.11",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # Real SDKs, so the provider parsers and the interception layer are tested
    # against genuine request/response shapes rather than our own fakes. The
    # Anthropic SDK pulls in httpx2, which is exactly why both client libraries
    # must be hooked.
    "openai>=1.40",
    "anthropic>=0.34",
    "mcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/neeldeshmane/driftcatch"
Issues = "https://github.com/neeldeshmane/driftcatch/issues"

[project.scripts]
drift = "driftcatch.cli:main"

[project.entry-points.pytest11]
driftcatch = "driftcatch.pytest_plugin"

# Templates and the py.typed marker live inside the package, so they ship in the
# wheel automatically: the UI needs no build step and no Node toolchain.
[tool.hatch.build.targets.wheel]
packages = ["driftcatch"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["driftcatch"]

[[tool.mypy.overrides]]
# The UI is an optional extra; its third-party imports may be absent.
module = ["driftcatch.ui.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
